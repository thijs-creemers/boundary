# fly.toml — Fly.io reference configuration for Wagoe
# https://fly.io/docs/reference/configuration/
#
# Deploy: fly deploy
# Secrets: fly secrets set JWT_SECRET="..." POSTGRES_PASSWORD="..."

app = "my-wagoe-app"
primary_region = "ams"

[build]
  # The root Dockerfile, not resources/conf/dev/Dockerfile: that one ends in
  # a `development` stage whose command is `tail -f /dev/null`. Fly does
  # have build-target, but the root image is the production one — it is
  # what CI builds and what deploy/k8s runs (BOU-439).
  dockerfile = "Dockerfile"

[env]
  WAG_ENV = "prod"
  # The prod profile defaults error reporting to Sentry and its adapter throws
  # on a missing DSN, so setting neither never boots (BOU-439). A reference
  # deployment must not require a Sentry account: drop this line and
  # `fly secrets set SENTRY_DSN=…` to turn it on.
  ERROR_REPORTING_PROVIDER = "no-op"
  HTTP_PORT = "3000"
  POSTGRES_HOST = "my-wagoe-app-db.internal"
  POSTGRES_PORT = "5432"
  POSTGRES_DB = "wagoe"
  POSTGRES_USER = "wagoe"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[services.http_checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
  path = "/health/ready"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
