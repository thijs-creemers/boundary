# render.yaml — Render Blueprint for Wagoe
# https://docs.render.com/blueprint-spec
#
# Deploy: connect your repo on render.com and select this blueprint

services:
  - type: web
    name: wagoe-app
    runtime: docker
    # The root Dockerfile, not resources/conf/dev/Dockerfile: that one ends
    # in a `development` stage whose command is `tail -f /dev/null`, and
    # Render's blueprint spec has no field to select a build stage, so it
    # would deploy a container that starts and serves nothing (BOU-439).
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: standard
    healthCheckPath: /health/ready
    envVars:
      - key: WAG_ENV
        value: prod
      # The prod profile defaults error reporting to Sentry and its adapter
      # throws on a missing DSN, so a blueprint that sets neither never boots
      # (BOU-439). A reference deployment must not require a Sentry account:
      # delete this and add SENTRY_DSN as a secret to turn it on.
      - key: ERROR_REPORTING_PROVIDER
        value: no-op
      - key: HTTP_PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: POSTGRES_HOST
        fromDatabase:
          name: wagoe-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: wagoe-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: wagoe-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: wagoe-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: wagoe-db
          property: password

databases:
  - name: wagoe-db
    plan: standard
    region: frankfurt
    postgresMajorVersion: "16"
